# ============================================================
#  MACD Trader - 設定ファイル
#  ここを編集するだけで全ての売買条件を変更できます
# ============================================================

# ── 監視銘柄 ─────────────────────────────────────────────────
symbol: "US.SPCX"          # moomoo形式: US.TICKER / HK.00700
market: "US"               # US / HK

# ── MACD パラメータ ──────────────────────────────────────────
macd:
  fast_period: 12          # 短期EMA期間
  slow_period: 26          # 長期EMA期間
  signal_period: 9         # シグナル線期間
  timeframe: "K_1M"        # K_1M / K_5M / K_15M / K_30M / K_60M

# ── エントリー条件（買い）────────────────────────────────────
entry:
  # GCが何分間継続したら買いシグナルとみなすか
  gc_duration_minutes: 3

  # MACDヒストグラムの最小値フィルター（強いGCのみ）
  # 0.0 で無効（全GCを対象にする）
  macd_histogram_min: 0.0

  # 出来高フィルター: 直近20本平均の何倍以上か（1.0で無効）
  volume_surge_ratio: 1.0

  # スプレッドが広すぎる場合はスキップ（%単位、0で無効）
  max_spread_pct: 0.1

# ── エグジット条件（売り）複数条件はOR評価 ───────────────────
exit:
  # --- 条件① ピーク検出（天井からの下落）---
  # 高値から何%下落したら売り（0で無効）
  peak_drop_pct: 1.5

  # 高値から下落状態が何分続いたら売り（0で無効）
  peak_drop_duration_minutes: 5

  # ピーク判定の感度: 何本連続で高値を更新しなければピークとみなすか
  peak_confirmation_bars: 3

  # --- 条件② デッドクロス ---
  # DCが発生したら即売り
  dead_cross: true

  # DCが何分間継続したら売り（0=DC発生直後に即売り）
  dc_duration_minutes: 0

  # --- 条件③ 利確・損切り ---
  # エントリー価格から+何%で利確（0で無効）
  take_profit_pct: 3.0

  # エントリー価格から-何%で損切り（0で無効）
  stop_loss_pct: 1.5

  # --- 条件④ 時間切れ ---
  # 最大保有時間（分）を超えたら強制決済（0で無効）
  max_hold_minutes: 60

# ── 発注設定 ─────────────────────────────────────────────────
order:
  quantity: 5              # 1回あたりの発注株数
  order_type: "market"     # market（成行） / limit（指値）

  # 指値の場合: 現在価格から何%オフセットするか
  # 買い: 現在価格 + offset、売り: 現在価格 - offset
  limit_offset_pct: 0.02

  # true=模擬取引（Paper Trading）、false=本番取引
  paper_trading: true

# ── リスク管理 ───────────────────────────────────────────────
risk:
  # 1日の最大取引回数（超えたらその日は停止）
  max_daily_trades: 10

  # 口座残高の何%を失ったらその日の取引を停止（0で無効）
  max_daily_loss_pct: 3.0

  # 1トレード完了後、次のエントリーまでの待機時間（分）
  cooldown_minutes: 5

  # 1銘柄への最大投資額（USD、0で無制限）
  max_position_value: 0

# ── ログ設定 ─────────────────────────────────────────────────
logging:
  # ログレベル: DEBUG / INFO / WARNING / ERROR
  level: "INFO"

  # 取引履歴をCSVに保存するか
  save_trade_log: true
  trade_log_path: "logs/trades.csv"

  # コンソールにリアルタイム価格を表示するか
  show_realtime_price: true

# ── moomoo OpenD 接続設定 ────────────────────────────────────
opend:
  host: "127.0.0.1"
  port: 11111
